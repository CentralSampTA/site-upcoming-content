# Security headers for upcoming.sampta.org
#
# This site is almost entirely the editors' Decap CMS admin panel (/admin/),
# which authenticates editors via GitHub OAuth. Previously this repo had no
# netlify.toml, so the subdomain shipped no CSP, clickjacking, MIME-sniffing,
# or referrer protections. The CSP below mirrors the /admin/* policy used on
# the main sampta.org site, which is known to work with Decap CMS 3.x
# (it needs 'unsafe-inline'/'unsafe-eval' and https: connect/script sources
# to reach GitHub's API and the CDN-hosted CMS bundle).

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; connect-src 'self' https: data: blob:; font-src 'self' https: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https:"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    # The whole subdomain is an editing tool; keep it out of search indexes.
    X-Robots-Tag = "noindex, nofollow, noarchive"
